version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    ignore:
      # fastembed 0.9.x requires huggingface-hub <2; wait for upstream support.
      - dependency-name: huggingface-hub
        update-types: [version-update:semver-major]
      # qdrant-client 1.x requires portalocker <4; wait for upstream support.
      - dependency-name: portalocker
        update-types: [version-update:semver-major]
    groups:
      python-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
