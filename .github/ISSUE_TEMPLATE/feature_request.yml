name: Feature request
description: Suggest an improvement or a new capability.
title: "feat: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For large changes, describe the use case first so the approach can be
        agreed before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do, and what blocks it today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
