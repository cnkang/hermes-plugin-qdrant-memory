name: Shared destination security

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-server:
    name: Device identity on actual Qdrant Server ${{ matrix.server.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        server:
          - version: '1.20.1'
            image: qdrant/qdrant@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
          - version: '1.20.2'
            image: qdrant/qdrant@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    services:
      qdrant:
        image: ${{ matrix.server.image }}
        ports: ['6333:6333']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install '.[mcp]' 'pytest>=8,<10' 'qdrant-client==1.20.0'
      - name: Assert the running Qdrant Server version
        env:
          EXPECTED_QDRANT_VERSION: ${{ matrix.server.version }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          deadline = time.monotonic() + 60
          while True:
              remaining = deadline - time.monotonic()
              if remaining <= 0:
                  raise SystemExit("Qdrant Server did not respond within 60 seconds")
              try:
                  with urlopen("http://127.0.0.1:6333/", timeout=min(2, remaining)) as response:
                      version = json.load(response)["version"]
                  break
              except (URLError, TimeoutError):
                  time.sleep(min(1, max(0, deadline - time.monotonic())))
          expected = os.environ["EXPECTED_QDRANT_VERSION"]
          if version != expected:
              raise SystemExit(f"Expected Qdrant Server {expected}, got {version}")
          print(f"Confirmed Qdrant Server {version}")
          PY
      - name: Require actual Server private scope, CAS and receipt recovery
        env:
          QDRANT_DEVICE_FIXTURE_URL: http://127.0.0.1:6333
        run: python -m pytest tests/security/test_device_server.py -q
  remote-mcp:
    name: HTTPS MCP two-network acceptance (${{ matrix.sdk }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: ['mcp>=1.30,<2', 'mcp>=2,<3']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Require real TLS MCP across isolated container networks
        shell: bash
        env:
          MCP_REQUIREMENT: ${{ matrix.sdk }}
        run: python scripts/test_remote_mcp_docker.py "$MCP_REQUIREMENT" | tee remote-https-evidence.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: remote-https-${{ strategy.job-index }}
          path: remote-https-evidence.jsonl
          if-no-files-found: error
  protected-owner:
    name: Protected Owner and Qdrant TLS/JWT isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QDRANT_TEST_IMAGE: qdrant/qdrant@sha256:d18c8e5061be3eaea2f53fbee1f0bf0382dc59cbb9b7112e41ffcc937ec14220
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install a compatible Qdrant test pair
        run: python -m pip install '.[mcp]' 'pytest>=8,<10' 'qdrant-client==1.20.0'
      - name: Require deterministic protected destination contracts
        run: python -m pytest tests/security/test_shared_security.py -q
      - name: Fetch the disposable fixture image
        run: docker pull "$QDRANT_TEST_IMAGE"
      - name: Require actual database denial and authorized shared writes
        run: python scripts/test_shared_security_docker.py "$QDRANT_TEST_IMAGE"
