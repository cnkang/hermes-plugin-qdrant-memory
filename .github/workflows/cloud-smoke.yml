name: Optional Qdrant Cloud smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      use_existing_test_key:
        description: 'Authorize a fresh disposable Owner collection with the existing test key'
        type: boolean
        default: false

concurrency:
  group: cloud-smoke-${{ github.ref }}

permissions:
  contents: read

jobs:
  owner-availability:
    name: Check scoped Cloud Owner input availability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: qdrant-cloud
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        name: Report availability without exposing credentials
        env:
          QDRANT_CLOUD_URL: ${{ secrets.QDRANT_CLOUD_URL }}
          QDRANT_CLOUD_OWNER_API_KEY: ${{ secrets.QDRANT_CLOUD_OWNER_API_KEY }}
          QDRANT_CLOUD_OWNER_COLLECTION: ${{ secrets.QDRANT_CLOUD_OWNER_COLLECTION }}
          QDRANT_CLOUD_API_KEY: ${{ secrets.QDRANT_CLOUD_API_KEY }}
          USE_EXISTING_TEST_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.use_existing_test_key }}
        run: |
          python3 - <<'PY'
          import os
          scoped = bool(os.environ['QDRANT_CLOUD_OWNER_API_KEY'] and os.environ['QDRANT_CLOUD_OWNER_COLLECTION'])
          disposable = os.environ['USE_EXISTING_TEST_KEY'] == 'true' and bool(os.environ['QDRANT_CLOUD_API_KEY'])
          available = bool(os.environ['QDRANT_CLOUD_URL']) and (scoped or disposable)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(available).lower()}\n')
          print('Owner test inputs available.' if available else 'SKIPPED: no authorized Cloud Owner inputs.')
          PY
  owner:
    name: Scoped Cloud Owner devices and recovery
    needs: owner-availability
    if: needs.owner-availability.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qdrant-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Prepare authorized Owner test parameters
        id: owner
        env:
          QDRANT_CLOUD_URL: ${{ secrets.QDRANT_CLOUD_URL }}
          QDRANT_CLOUD_OWNER_API_KEY: ${{ secrets.QDRANT_CLOUD_OWNER_API_KEY }}
          QDRANT_CLOUD_OWNER_COLLECTION: ${{ secrets.QDRANT_CLOUD_OWNER_COLLECTION }}
          QDRANT_CLOUD_API_KEY: ${{ secrets.QDRANT_CLOUD_API_KEY }}
          USE_EXISTING_TEST_KEY: ${{ github.event_name == 'workflow_dispatch' && inputs.use_existing_test_key }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          scoped = bool(os.environ['QDRANT_CLOUD_OWNER_API_KEY'] and os.environ['QDRANT_CLOUD_OWNER_COLLECTION'])
          disposable = os.environ['USE_EXISTING_TEST_KEY'] == 'true' and bool(os.environ['QDRANT_CLOUD_API_KEY'])
          available = bool(os.environ['QDRANT_CLOUD_URL']) and (scoped or disposable)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(available).lower()}\n')
          if available:
              path = Path(os.environ['RUNNER_TEMP']) / 'cloud-owner-config.json'
              settings = {'url': os.environ['QDRANT_CLOUD_URL']}
              if scoped:
                  settings.update(owner_api_key=os.environ['QDRANT_CLOUD_OWNER_API_KEY'], owner_collection=os.environ['QDRANT_CLOUD_OWNER_COLLECTION'])
                  test = 'test_scoped_cloud_owner_devices_cas_and_recovery'
              else:
                  settings['test_api_key'] = os.environ['QDRANT_CLOUD_API_KEY']
                  test = 'test_cloud_owner_disposable_collection'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write(f'test={test}\n')
              path.write_text(json.dumps(settings))
              path.chmod(0o600)
          else:
              raise SystemExit('Scoped Owner inputs changed after availability check; rerun authorization.')
          PY
      - name: Install Owner acceptance dependencies
        if: steps.owner.outputs.available == 'true'
        run: python -m pip install '.[remote]' 'pytest>=8,<10'
      - name: Execute authorized Cloud Owner acceptance
        if: steps.owner.outputs.available == 'true'
        env:
          OWNER_TEST: ${{ steps.owner.outputs.test }}
        run: python -m pytest "tests/security/test_cloud_owner.py::$OWNER_TEST" -q -rP --qdrant-cloud-config="$RUNNER_TEMP/cloud-owner-config.json" --junitxml=cloud-owner-results.xml -o junit_logging=system-out
      - name: Require executed credentialed acceptance
        if: steps.owner.outputs.available == 'true'
        run: >-
          python -c "import xml.etree.ElementTree as E;
          suites=E.parse('cloud-owner-results.xml').findall('.//testsuite');
          assert sum(int(s.get('tests',0)) for s in suites)>=1;
          assert sum(int(s.get('skipped',0)) for s in suites)==0"
      - name: Verify disposable collection cleanup independently
        if: always() && steps.owner.outputs.available == 'true'
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'cloud-owner-config.json'
          settings = json.loads(path.read_text())
          if settings.get('provision_started'):
              from qdrant_client import QdrantClient
              from qdrant_memory.config import validate_url
              collection = settings['owner_collection']
              assert re.fullmatch(r'qm_owner_ci_[0-9a-f]{32}', collection)
              validate_url(settings['url'], cloud=True, api_key=settings['test_api_key'])
              from contextlib import closing
              with closing(QdrantClient(url=settings['url'], api_key=settings['test_api_key'], trust_env=False)) as client:
                  if client.collection_exists(collection):
                      client.delete_collection(collection)
                  assert not client.collection_exists(collection), 'Cloud test collection cleanup failed'
              print('Independent cleanup verified: disposable Cloud Owner collection is absent.')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && steps.owner.outputs.available == 'true'
        with:
          name: scoped-cloud-owner-evidence
          path: cloud-owner-results.xml
          if-no-files-found: error
      - name: Remove scoped Owner credential file
        if: always()
        run: rm -f "$RUNNER_TEMP/cloud-owner-config.json"
  cloud:
    name: Authenticated Cloud integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: qdrant-cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Prepare scoped Cloud parameters
        id: cloud
        env:
          QDRANT_CLOUD_URL: ${{ secrets.QDRANT_CLOUD_URL }}
          QDRANT_CLOUD_API_KEY: ${{ secrets.QDRANT_CLOUD_API_KEY }}
          QDRANT_CLOUD_COLLECTION_PREFIX: ${{ secrets.QDRANT_CLOUD_COLLECTION_PREFIX }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          available = bool(os.environ['QDRANT_CLOUD_URL'] and os.environ['QDRANT_CLOUD_API_KEY'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'available={str(available).lower()}\n')
          if available:
              path = Path(os.environ['RUNNER_TEMP']) / 'cloud-config.json'
              path.write_text(json.dumps({'url': os.environ['QDRANT_CLOUD_URL'], 'api_key': os.environ['QDRANT_CLOUD_API_KEY'], 'collection_prefix': os.environ['QDRANT_CLOUD_COLLECTION_PREFIX'] or 'hermes_smoke_'}))
              path.chmod(0o600)
          else:
              print('SKIPPED: configure QDRANT_CLOUD_URL and QDRANT_CLOUD_API_KEY to run Cloud integration.')
          PY
      - name: Check out tested Hermes and PM
        if: steps.cloud.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .host
      - name: Build isolated dependencies through PM
        if: steps.cloud.outputs.available == 'true'
        working-directory: .host
        env:
          HERMES_HOME: ${{ runner.temp }}/cloud-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/cloud-runtime
        run: |
          python -m pm.build_env --source . --export-requirements "$RUNNER_TEMP/cloud-requirements.txt"
          python -c 'import tomllib; from pathlib import Path; p=tomllib.loads(Path("../pyproject.toml").read_text()); print("\n".join(p["project"]["dependencies"] + p["dependency-groups"]["test"]))' >> "$RUNNER_TEMP/cloud-requirements.txt"
          python -m pm.build_env --out "$GITHUB_WORKSPACE/.test-env" --requirements "$RUNNER_TEMP/cloud-requirements.txt"
      - name: Exercise authenticated Cloud
        if: steps.cloud.outputs.available == 'true'
        working-directory: .host
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.test-env/bin/python
        run: scripts/run_tests.sh "$GITHUB_WORKSPACE/tests/test_remote_qdrant.py" -j 1 --file-retries 0 -- -k cloud --tb=short --qdrant-cloud-config="$RUNNER_TEMP/cloud-config.json"
      - name: Remove scoped credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/cloud-config.json"
