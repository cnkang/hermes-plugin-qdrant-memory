name: Latest Hermes compatibility
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-hermes:
    name: Current Hermes main (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Check out latest Hermes main
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: main
          path: .host
      - name: Check out pinned dependency manager
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .pm-host
      - name: Record tested revisions
        id: revisions
        shell: bash
        run: |
          hermes_sha=$(git -C .host rev-parse HEAD)
          plugin_sha=$(git rev-parse HEAD)
          echo "hermes_sha=$hermes_sha" >> "$GITHUB_OUTPUT"
          echo "plugin_sha=$plugin_sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Hermes compatibility inputs"
            echo ""
            echo "- Hermes ref: main"
            echo "- Hermes checked-out SHA: $hermes_sha"
            echo "- Plugin checked-out SHA: $plugin_sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build combined isolated test environment with pinned PM
        working-directory: .pm-host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-upstream-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-upstream-runtime
        run: |
          python -m pm.build_env --source "$GITHUB_WORKSPACE/.host" \
            --export-requirements "$RUNNER_TEMP/upstream-host-requirements.txt"
          python - <<'PY'
          import os
          from pathlib import Path

          requirements = Path(os.environ["RUNNER_TEMP"]) / "upstream-host-requirements.txt"
          requirements.write_text(
              requirements.read_text(encoding="utf-8").rstrip() + "\n",
              encoding="utf-8",
          )
          PY
          python -c 'import tomllib; from pathlib import Path; p = tomllib.loads(Path("../pyproject.toml").read_text()); print("\n".join(p["project"]["dependencies"] + p["dependency-groups"]["test"]))' \
            >> "$RUNNER_TEMP/upstream-host-requirements.txt"
          python -m pm.build_env --out "$RUNNER_TEMP/wheel-build-env" \
            --requirement 'setuptools>=75,<83' --requirement 'wheel>=0.45,<1'
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wheel-build-env/bin/python" -c 'import os, setuptools.build_meta as b; b.build_wheel(os.environ["RUNNER_TEMP"] + "/plugin-wheel")'
          cd .pm-host
          python -m pm.build_env --out "$GITHUB_WORKSPACE/.test-env" \
            --requirements "$RUNNER_TEMP/upstream-host-requirements.txt" \
            --requirement "hermes-plugin-qdrant-memory @ file://$RUNNER_TEMP/plugin-wheel/hermes_plugin_qdrant_memory-0.1.0-py3-none-any.whl"
      - name: Install plugin distribution and verify its entry point
        working-directory: ${{ runner.temp }}
        run: |
          "$GITHUB_WORKSPACE/.test-env/bin/python" - <<'PY'
          from importlib.metadata import entry_points
          from importlib.resources import files

          matches = [
              entry
              for entry in entry_points(group="hermes_agent.memory_providers")
              if entry.name == "qdrant-memory"
          ]
          assert len(matches) == 1, matches
          register = matches[0].load()
          assert callable(register), register
          manifest = files("qdrant_memory").joinpath("plugin.yaml")
          assert manifest.is_file(), manifest
          print(f"Installed entry point: {matches[0].name} = {matches[0].value}; manifest packaged")
          PY
      - name: Run focused host integration contracts
        working-directory: .host
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.test-env/bin/python
        run: |
          scripts/run_tests.sh \
            "$GITHUB_WORKSPACE/tests/test_discovery_cli.py" \
            "$GITHUB_WORKSPACE/tests/test_setup_contract.py" \
            "$GITHUB_WORKSPACE/tests/test_checkpoint_lifecycle.py" \
            "$GITHUB_WORKSPACE/tests/test_shutdown_contract.py" \
            "$GITHUB_WORKSPACE/tests/test_provider.py" \
            "$GITHUB_WORKSPACE/tests/test_recovery_evaluation.py" \
            "$GITHUB_WORKSPACE/tests/test_manifest_contract.py" \
            -j 1 --file-retries 0 -- --tb=short
      - name: Require Hermes MemoryManager admission and shutdown contracts
        working-directory: .host
        env:
          HERMES_QDRANT_REQUIRE_HOST_SYNC: '1'
        run: |
          "$GITHUB_WORKSPACE/.test-env/bin/python" -m pytest \
            "$GITHUB_WORKSPACE/tests/test_host_lifecycle.py" -q --tb=short
