name: Optional local embedding

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-embedding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-model:
    name: CPU model (${{ matrix.os }})
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'pull_request' && github.actor == 'dependabot[bot]')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install optional CPU dependencies with binary wheels
        run: >-
          python -m pip install --only-binary=:all: ".[mcp,local]" "pytest>=8,<10"
      - name: Require provider choice, immutable model and setup contracts
        run: >-
          python -m pytest -q tests/test_local_embedding.py tests/test_local_model.py
          tests/standalone/test_managed_setup.py --junitxml=local-contracts.xml
      - name: Prepare pinned artifacts without an Ollama service
        shell: bash
        run: python -m qdrant_memory.standalone prepare-model --cache-dir "$RUNNER_TEMP/local-model-cache"
      - name: Require real offline CPU model and official MCP acceptance
        env:
          QDRANT_MEMORY_TEST_LOCAL_CACHE: ${{ runner.temp }}/local-model-cache
        run: python -m pytest -q tests/local_model --junitxml=local-model.xml
      - name: Reject skipped or incomplete real-model acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E; r=E.parse('local-model.xml');
          s=r.findall('.//testsuite');
          assert sum(int(x.get('tests',0)) for x in s)>=3;
          assert sum(int(x.get('skipped',0)) for x in s)==0"
      - name: Save public acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-model-${{ matrix.os }}
          path: |
            local-contracts.xml
            local-model.xml
          if-no-files-found: error
