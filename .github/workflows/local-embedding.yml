name: Optional local embedding

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-embedding-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-model:
    name: CPU model (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Build the audited Pillow 13 compatibility wheel
        # Build the same audited Pillow 13 compatibility wheel on all three OSes.
        # Remove the builder/find-links after upstream fastembed#830 is released.
        # Installation still resolves dependencies and pip check must pass.
        run: >-
          python scripts/build_fastembed_compat.py --output-dir .ci-wheels
          --check-lock requirements-local.txt
      - name: Install the frozen CPU security snapshot without service credentials
        if: matrix.os == 'ubuntu-24.04'
        run: >-
          python -m pip install --require-hashes --only-binary=:all:
          --find-links .ci-wheels -r requirements-local.txt
      - name: Install optional CPU dependencies with binary wheels
        run: >-
          python -m pip install --only-binary=:all: --find-links .ci-wheels
          ".[mcp,local]" "Pillow==13.0.0" "pytest>=8,<10"
      - name: Verify installed dependency compatibility
        run: python -m pip check
      - name: Require the exact Pillow 13 compatibility build
        # Keep this separate: PowerShell must not mask a failed pip check above.
        run: python -c "from importlib.metadata import version; assert version('pillow') == '13.0.0'; assert version('fastembed') == '0.9.0+qm.pillow13'"
      - name: Require provider choice, immutable model and setup contracts
        run: >-
          python -m pytest -q tests/test_local_embedding.py tests/test_local_model.py
          tests/test_fastembed_compat.py tests/test_local_embedding_provider.py
          tests/standalone/test_managed_setup.py --junitxml=local-contracts.xml
      - name: Prepare pinned artifacts without an Ollama service
        shell: bash
        run: python -m qdrant_memory.standalone prepare-model --cache-dir "$RUNNER_TEMP/local-model-cache"
      - name: Require real offline CPU model and official MCP acceptance
        env:
          QDRANT_MEMORY_TEST_LOCAL_CACHE: ${{ runner.temp }}/local-model-cache
        run: python -m pytest -q tests/local_model --junitxml=local-model.xml
      - name: Reject skipped or incomplete real-model acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E; r=E.parse('local-model.xml');
          s=r.findall('.//testsuite');
          assert sum(int(x.get('tests',0)) for x in s)>=3;
          assert sum(int(x.get('skipped',0)) for x in s)==0"
      - name: Save public acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-model-${{ matrix.os }}
          path: |
            local-contracts.xml
            local-model.xml
          if-no-files-found: error
