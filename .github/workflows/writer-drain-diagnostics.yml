name: Writer drain diagnostics (temporary)

on:
  push:
    branches: ['diag/issue-115-20261114']

permissions:
  contents: read

jobs:
  probe:
    name: Probe (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.14'
            repeats: 10
            pytest_runs: 2
            suite_runs: 1
          - os: windows-latest
            python: '3.11'
            repeats: 10
            pytest_runs: 2
            suite_runs: 1
          - os: ubuntu-24.04
            python: '3.14'
            repeats: 3
            pytest_runs: 1
            suite_runs: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Check out fixed supported-range Hermes host and dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .host
      - name: Build isolated test environment with Hermes PM
        working-directory: .host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-platform-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-platform-runtime
        shell: bash
        run: |
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --source "$GITHUB_WORKSPACE/.host" \
            --export-requirements "$RUNNER_TEMP/host-test-requirements.txt"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          requirements = Path(os.environ["RUNNER_TEMP"]) / "host-test-requirements.txt"
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          entries = project["project"]["dependencies"] + project["dependency-groups"]["test"]
          entries.append(f"hermes-plugin-qdrant-memory[mcp] @ {root.as_uri()}")
          requirements.write_text(
              requirements.read_text(encoding="utf-8").rstrip() + "\n" + "\n".join(entries) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$GITHUB_WORKSPACE/.test-env" \
            --requirements "$RUNNER_TEMP/host-test-requirements.txt"
      - name: Verify actual test interpreter
        shell: bash
        run: python scripts/verify_ci_python.py --expected "${{ matrix.python }}" --environment "$GITHUB_WORKSPACE/.test-env" --distribution hermes-plugin-qdrant-memory --require-distribution
      - name: Run repeated writer probes
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.host
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            TEST_PYTHON="$GITHUB_WORKSPACE/.test-env/Scripts/python.exe"
          else
            TEST_PYTHON="$GITHUB_WORKSPACE/.test-env/bin/python"
          fi
          echo "runner=$RUNNER_OS python=$($TEST_PYTHON -V)"
          for index in $(seq 1 ${{ matrix.repeats }}); do
            echo "=== probe $index"
            "$TEST_PYTHON" -m scripts.diagnose_writer_drain
          done
          for index in $(seq 1 ${{ matrix.pytest_runs }}); do
            echo "=== pytest $index"
            "$TEST_PYTHON" -m pytest tests/test_provider.py \
              -k test_100_fast_turns_no_loss_and_replay -q --durations=0
          done
          for index in $(seq 1 ${{ matrix.suite_runs }}); do
            echo "=== full suite $index"
            HERMES_QDRANT_REQUIRE_HOST_SYNC=1 "$TEST_PYTHON" -m pytest -q tests \
              --ignore=tests/test_remote_qdrant.py
          done
