name: Writer drain diagnostics (temporary)

on:
  push:
    branches: ['diag/issue-115-20261114']

permissions:
  contents: read

jobs:
  probe:
    name: Windows Python ${{ matrix.python }} shard ${{ matrix.shard }} (20 runs)
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Check out fixed supported-range Hermes host and dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .host
      - name: Build isolated test environment with Hermes PM
        working-directory: .host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-platform-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-platform-runtime
        shell: bash
        run: |
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --source "$GITHUB_WORKSPACE/.host" \
            --export-requirements "$RUNNER_TEMP/host-test-requirements.txt"
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"])
          requirements = Path(os.environ["RUNNER_TEMP"]) / "host-test-requirements.txt"
          project = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))
          entries = project["project"]["dependencies"] + project["dependency-groups"]["test"]
          entries.append(f"hermes-plugin-qdrant-memory[mcp] @ {root.as_uri()}")
          requirements.write_text(
              requirements.read_text(encoding="utf-8").rstrip() + "\n" + "\n".join(entries) + "\n",
              encoding="utf-8",
          )
          PY
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$GITHUB_WORKSPACE/.test-env" \
            --requirements "$RUNNER_TEMP/host-test-requirements.txt"
      - name: Verify actual test interpreter
        shell: bash
        run: python scripts/verify_ci_python.py --expected "${{ matrix.python }}" --environment "$GITHUB_WORKSPACE/.test-env" --distribution hermes-plugin-qdrant-memory --require-distribution
      - name: Run 20 independent durability tests without retries
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/.host
        run: |
          TEST_PYTHON="$GITHUB_WORKSPACE/.test-env/Scripts/python.exe"
          echo "runner=$RUNNER_OS python=$($TEST_PYTHON -V)"
          mkdir -p writer-results
          failed=0
          for index in $(seq 1 20); do
            echo "=== shard ${{ matrix.shard }} iteration $index of 20"
            if "$TEST_PYTHON" -m pytest \
              tests/test_provider.py::test_100_fast_turns_no_loss_and_replay \
              -q --durations=0 --junitxml="writer-results/results-$index.xml"; then
              echo "ITERATION_RESULT shard=${{ matrix.shard }} iteration=$index exit=0"
            else
              code=$?
              echo "ITERATION_RESULT shard=${{ matrix.shard }} iteration=$index exit=$code"
              failed=$((failed + 1))
            fi
          done
          echo "SHARD_RESULT python=${{ matrix.python }} shard=${{ matrix.shard }} runs=20 failed=$failed"
          test "$failed" -eq 0
      - name: Preserve every iteration result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: writer-python-${{ matrix.python }}-shard-${{ matrix.shard }}
          path: writer-results/*.xml
          if-no-files-found: error
