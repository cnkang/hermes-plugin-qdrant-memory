name: Small-model Owner lifecycle smoke

on:
  workflow_dispatch:
    inputs:
      model_profile:
        description: One fixed local smoke profile; default permits the configured override
        type: choice
        default: smoke-ollama
        options: [smoke-ollama, smoke-qwen06, smoke-qwen08, smoke-qwen17, smoke-qwen2]
  pull_request:
    paths:
      - qdrant_memory/**
      - scripts/*owner*lifecycle.py
      - scripts/start_quality_ollama.sh
      - tests/test_model_smoke.py
      - tests/quality/model-profiles.json
      - .github/workflows/owner-model-*.yml
  push:
    branches: [main]
    paths:
      - qdrant_memory/**
      - scripts/*owner*lifecycle.py
      - scripts/start_quality_ollama.sh
      - tests/test_model_smoke.py
      - tests/quality/model-profiles.json
      - .github/workflows/owner-model-*.yml

permissions:
  contents: read

jobs:
  smoke:
    uses: ./.github/workflows/owner-model-quality.yml
    with:
      profile: ${{ inputs.model_profile || 'smoke-ollama' }}
      mode: smoke
