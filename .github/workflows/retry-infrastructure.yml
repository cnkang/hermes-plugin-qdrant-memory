name: Retry transient action downloads

on:
  workflow_run:
    workflows: [CI, Standalone compatibility, Platform compatibility, Shared destination security]
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: infrastructure-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      (github.event.workflow_run.event == 'push' ||
      github.event.workflow_run.event == 'pull_request') &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3 &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect bootstrap evidence and retry only confirmed transient downloads
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          script_path="$RUNNER_TEMP/retry-infrastructure.py"
          downloaded=false
          for attempt in 1 2 3; do
            if gh api --method GET "repos/$GITHUB_REPOSITORY/contents/scripts/retry_infrastructure.py" \
              -f "ref=$TRUSTED_WORKFLOW_SHA" --jq .content | base64 --decode > "$script_path"; then
              downloaded=true
              break
            fi
            sleep "$((attempt * 2))"
          done
          test "$downloaded" = true
          python3 "$script_path"
