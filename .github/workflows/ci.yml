name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Check out Hermes dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .host
      - name: Build isolated Ruff environment
        working-directory: .host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-lint-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-lint-runtime
        run: python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$GITHUB_WORKSPACE/.lint-env" --requirement 'ruff==0.15.1'
      - name: Verify Ruff environment interpreter and install target
        run: python scripts/verify_ci_python.py --expected 3.11 --environment "$GITHUB_WORKSPACE/.lint-env" --distribution ruff --require-distribution
      - name: Lint source, docstrings and imports
        run: .lint-env/bin/ruff check .
      - name: Check formatting
        run: .lint-env/bin/ruff format --check .

  tests:
    name: Behavior contracts (${{ matrix.host.name }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        host:
          - name: minimum
          - name: latest-main
    services:
      qdrant:
        image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
        ports: ['6333:6333', '6334:6334']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Check out minimum Hermes host
        if: matrix.host.name == 'minimum'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: .host
      - name: Check out latest Hermes host
        if: matrix.host.name == 'latest-main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: main
          path: .host
      - name: Record tested Hermes revision
        if: matrix.host.name == 'latest-main'
        run: |
          hermes_sha=$(git -C .host rev-parse HEAD)
          {
            echo "## Hermes compatibility inputs"
            echo ""
            echo "- Hermes ref: main"
            echo "- Hermes checked-out SHA: $hermes_sha"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check out fixed dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 3ba2b0787ed3a73ec3b08085ed0137f235209cf4
          path: .pm-host
      - name: Build disposable test environment with Hermes PM
        working-directory: .pm-host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-test-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-test-runtime
        run: |
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --source "$GITHUB_WORKSPACE/.host" --export-requirements "$RUNNER_TEMP/host-test-requirements.txt"
          python -c 'import tomllib; from pathlib import Path; p = tomllib.loads(Path("../pyproject.toml").read_text()); print("\n".join(p["project"]["dependencies"] + p["dependency-groups"]["test"]))' >> "$RUNNER_TEMP/host-test-requirements.txt"
          # Preserve the host's locked security overrides, including Pillow 13.
          # Exported requirements alone do not contain uv manifest overrides.
          python -m pm.build_env --out "$GITHUB_WORKSPACE/.test-env" \
            --python "$(python -c 'import sys; print(sys.executable)')" \
            --lock "$GITHUB_WORKSPACE/.host/uv.lock" \
            --requirements "$RUNNER_TEMP/host-test-requirements.txt" \
            --requirement "hermes-plugin-qdrant-memory[mcp] @ file://$GITHUB_WORKSPACE"
      - name: Verify Python matrix interpreter and install target
        run: python scripts/verify_ci_python.py --expected "${{ matrix.python }}" --environment "$GITHUB_WORKSPACE/.test-env" --distribution hermes-plugin-qdrant-memory
      - name: Run canonical host test runner
        working-directory: .host
        env:
          HERMES_PYTHON: ${{ github.workspace }}/.test-env/bin/python
          TEST_PYTHON_VERSION: ${{ matrix.python }}
          QDRANT_CONTAINER: ${{ job.services.qdrant.id }}
        run: |
          if [ "$TEST_PYTHON_VERSION" = '3.14' ]; then
            # Serial append avoids concurrent writers to the same coverage database.
            scripts/run_tests.sh "$GITHUB_WORKSPACE/tests" -j 1 --file-retries 0 -- \
              --tb=short --cov=qdrant_memory --cov-report= --cov-append \
              --qdrant-test-url=http://127.0.0.1:6333 --qdrant-test-container="$QDRANT_CONTAINER"
            cd "$GITHUB_WORKSPACE"
            "$HERMES_PYTHON" -m coverage xml --data-file=.host/.coverage -o coverage.xml
          else
            scripts/run_tests.sh "$GITHUB_WORKSPACE/tests" -j 1 --file-retries 0 -- --tb=short \
              --qdrant-test-url=http://127.0.0.1:6333 --qdrant-test-container="$QDRANT_CONTAINER"
          fi
      - name: Build and install wheel through PM
        if: matrix.host.name != 'latest-main'
        working-directory: .pm-host
        env:
          HERMES_HOME: ${{ runner.temp }}/wheel-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/wheel-runtime
        run: |
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$RUNNER_TEMP/wheel-build-env" --requirement 'setuptools>=77,<83' --requirement 'wheel>=0.45,<1'
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/wheel-build-env/bin/python" -c 'import os, setuptools.build_meta as b; b.build_wheel(os.environ["RUNNER_TEMP"] + "/plugin-wheel")'
          cd .pm-host
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$RUNNER_TEMP/wheel-env" --requirements "$RUNNER_TEMP/host-test-requirements.txt" \
            --lock "$GITHUB_WORKSPACE/.host/uv.lock" \
            --requirement "hermes-plugin-qdrant-memory @ file://$(find "$RUNNER_TEMP/plugin-wheel" -name 'hermes_plugin_qdrant_memory-*.whl' -print -quit)"
          python "$GITHUB_WORKSPACE/scripts/verify_ci_python.py" --expected "${{ matrix.python }}" --environment "$RUNNER_TEMP/wheel-build-env" --distribution setuptools --require-distribution
          python "$GITHUB_WORKSPACE/scripts/verify_ci_python.py" --expected "${{ matrix.python }}" --environment "$RUNNER_TEMP/wheel-env" --require-distribution
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/.host" "$RUNNER_TEMP/wheel-env/bin/python" "$GITHUB_WORKSPACE/scripts/verify_packaged.py"
      - name: Save coverage for SonarCloud
        if: matrix.python == '3.14' && matrix.host.name == 'minimum'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: error

  codex-windows:
    name: Codex Windows security (Python ${{ matrix.python }}, pywin32 ${{ matrix.pywin32 }})
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QDRANT_WINDOWS_SMB_FIXTURE: '1'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        pywin32: ['312']
        include:
          - python: '3.14'
            pywin32: '311'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Runtime and native Windows test dependencies
        run: python -m pip install . 'pytest>=8,<10' 'pytest-cov>=6,<8' 'pywin32==${{ matrix.pywin32 }}'
      - name: Verify setup-python selection and Runtime install target
        run: python scripts/verify_ci_python.py --expected "${{ matrix.python }}" --require-distribution
      - name: Start disposable runner services for the loopback SMB fixture
        run: |
          Start-Service LanmanServer, LanmanWorkstation
          # Enable short-name creation only in the disposable CI VM so the
          # alias bypass regression is always exercised, never silently skipped.
          $volume = python -c "import os,tempfile; print(os.path.splitdrive(tempfile.gettempdir())[0])"
          fsutil 8dot3name set 2
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable per-volume short-name settings' }
          fsutil 8dot3name set $volume 0
          if ($LASTEXITCODE -ne 0) { throw 'Cannot enable short names on the fixture volume' }
      - name: Require real native Windows filesystem contracts
        run: >-
          python -m pytest -q tests/test_codex_windows_files.py
          --junitxml=codex-windows-results.xml
          --cov=qdrant_memory.windows_files --cov-report=term-missing
          --cov-report=xml:coverage-windows.xml
      - name: Reject skipped or incomplete Windows checks
        run: >-
          python -c "import xml.etree.ElementTree as E;
          s=E.parse('codex-windows-results.xml').findall('.//testsuite');
          assert sum(int(x.get('tests',0)) for x in s)>=41;
          assert sum(int(x.get('skipped',0)) for x in s)==0"
      - name: Normalize native coverage paths for cross-platform analysis
        shell: python
        run: |
          import xml.etree.ElementTree as E
          report = E.parse('coverage-windows.xml')
          sources = report.find('sources')
          sources.clear()
          E.SubElement(sources, 'source').text = '.'
          classes = report.findall('.//class')
          assert len(classes) == 1
          assert classes[0].get('filename').endswith('windows_files.py')
          classes[0].set('filename', 'qdrant_memory/windows_files.py')
          report.write('coverage-windows.xml', encoding='utf-8')
      - name: Save native filesystem evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codex-windows-python-${{ matrix.python }}-pywin32-${{ matrix.pywin32 }}
          path: |
            codex-windows-results.xml
            coverage-windows.xml
          if-no-files-found: error

  mcp-coverage:
    name: MCP SDK 1.x and 2.x protocol coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Check out fixed dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .pm-host
      - name: Collect both SDK branches in isolated environments
        working-directory: .pm-host
        env:
          HERMES_HOME: ${{ runner.temp }}/mcp-coverage-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/mcp-coverage-runtime
        run: |
          for sdk in 1 2; do
            upper=$((sdk + 1))
            python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$RUNNER_TEMP/mcp-coverage-$sdk" \
              --requirement "hermes-plugin-qdrant-memory[remote] @ file://$GITHUB_WORKSPACE" \
              --requirement "mcp>=$sdk,<$upper" \
              --requirement 'pytest>=8,<10' --requirement 'pytest-cov>=6,<8'
            python "$GITHUB_WORKSPACE/scripts/verify_ci_python.py" --expected 3.14 --environment "$RUNNER_TEMP/mcp-coverage-$sdk" --require-distribution
            cd "$GITHUB_WORKSPACE"
            COVERAGE_FILE="$GITHUB_WORKSPACE/.coverage-mcp" \
              "$RUNNER_TEMP/mcp-coverage-$sdk/bin/python" -m pytest -q tests/standalone \
              --cov=qdrant_memory --cov-report= --cov-append
            cd .pm-host
          done
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/mcp-coverage-2/bin/python" -m coverage xml \
            --data-file=.coverage-mcp -o coverage-mcp.xml
      - name: Save MCP protocol coverage for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mcp-coverage
          path: coverage-mcp.xml
          if-no-files-found: error

  host-pins:
    name: Host pin compatibility (${{ matrix.host.name }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
        host:
          - name: minimum
          - name: latest-main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reconciliation tooling
        run: python -m pip install 'packaging>=24,<27'
      - name: Check out minimum Hermes host
        if: matrix.host.name == 'minimum'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: f97608f178d1ffeca59860195ab7da295f7c8e5f
          path: .host
      - name: Check out latest Hermes host
        if: matrix.host.name == 'latest-main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: main
          path: .host
      - name: Check out fixed dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .pm-host
      - name: Record host revision
        run: |
          echo "host-pins ${{ matrix.host.name }}: $(git -C .host rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Reconcile host pins and co-resolve shared pins
        working-directory: .pm-host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-pins-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-pins-runtime
        run: |
          plugin_requirement=$(python "$GITHUB_WORKSPACE/scripts/check_host_pins.py" \
            --host "$GITHUB_WORKSPACE/.host" \
            --emit-requirements "$RUNNER_TEMP/host-pins.txt" \
            --print-plugin-requirement)
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$RUNNER_TEMP/pin-check" \
            --requirements "$RUNNER_TEMP/host-pins.txt" --requirement "$plugin_requirement"
          python "$GITHUB_WORKSPACE/scripts/verify_ci_python.py" --expected "${{ matrix.python }}" --environment "$RUNNER_TEMP/pin-check" --require-distribution

  sonarcloud:
    name: SonarCloud quality gate
    needs: [tests, mcp-coverage, codex-windows]
    # The token is unavailable to fork pull requests. Dependabot pull requests
    # are skipped by their immutable author identity, not by the mutable actor.
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: python-coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: mcp-coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: codex-windows-python-3.14-pywin32-312
      - name: Require SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_TOKEN" || { echo '::error::Configure SONAR_TOKEN and import the project in SonarCloud.'; exit 1; }
      - name: Analyze and wait for quality gate
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snyk:
    name: Snyk dependency security
    # The organization token must never enter a process that runs contributor
    # code. Dependency scanning therefore runs only for the trusted main tree.
    # Pull requests verify the dependency inputs without credentials in the
    # dependency-lock job. See docs/ci.md.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Require Snyk credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || { echo '::error::Configure SNYK_TOKEN for the Snyk organization.'; exit 1; }
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Check out Hermes dependency manager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          repository: NousResearch/hermes-agent
          ref: 4787e4d56fc8d9265d4c7d3c0fe5accee86b4078
          path: .host
      - name: Build isolated runtime dependency environment
        working-directory: .host
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-security-home
          HERMES_RUNTIME_DIR: ${{ runner.temp }}/hermes-security-runtime
        run: |
          python -m pm.build_env --python "$(python -c 'import sys; print(sys.executable)')" --out "$GITHUB_WORKSPACE/.scan-env" \
            --requirements "$GITHUB_WORKSPACE/requirements.txt" --requirement 'pip>=25,<27'
          python "$GITHUB_WORKSPACE/scripts/verify_ci_python.py" --expected 3.11 --environment "$GITHUB_WORKSPACE/.scan-env" --distribution pip --require-distribution
          "$GITHUB_WORKSPACE/.scan-env/bin/python" -m pip --version
      - name: Scan dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements.txt --package-manager=pip --command=.scan-env/bin/python --severity-threshold=high --remote-repo-url="https://github.com/${{ github.repository }}"
      - name: Monitor main dependency snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=requirements.txt --package-manager=pip --command=.scan-env/bin/python
      - name: Install and verify optional CPU security snapshot
        run: |
          .scan-env/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-local.txt
          .scan-env/bin/python -m pip check
      - name: Scan optional CPU dependencies
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=requirements-local.txt --package-manager=pip --command=.scan-env/bin/python --severity-threshold=high --remote-repo-url="https://github.com/${{ github.repository }}"
      - name: Monitor main optional CPU dependency snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --file=requirements-local.txt --package-manager=pip --command=.scan-env/bin/python

  snyk-code:
    name: Snyk code security
    # Snyk Code consumes the organization token and a metered service. Keep it
    # on the protected main tree; scheduled-security.yml repeats the scan weekly
    # and a maintainer can dispatch it explicitly. Pull requests rely on CodeQL,
    # SonarCloud and review instead, so no contributor tree ever holds the token.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require Snyk credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || { echo '::error::Configure SNYK_TOKEN for the Snyk organization.'; exit 1; }
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Scan source
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          set -o pipefail
          attempts=3
          for attempt in 1 2 3; do
            echo "Snyk Code scan attempt ${attempt}/${attempts} (8-minute limit)"
            log="$RUNNER_TEMP/snyk-code-${attempt}.log"
            if timeout --kill-after=30s 8m \
              snyk code test . --severity-threshold=high 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi

            # A credential or entitlement failure is final: retrying cannot
            # resolve it, and it must never be reported as a pass.
            if grep -qiE 'authentication failed|not authenticated|invalid token|unauthorized|SNYK_TOKEN' "$log"; then
              echo "::error::Snyk Code authentication failed (AUTH_ERROR)."
              exit 1
            fi

            case "$status" in
              1|3)
                exit "$status"
                ;;
              2|124|137)
                if [ "$attempt" -eq "$attempts" ]; then
                  echo "::error::Snyk Code scan failed after ${attempts} attempts (exit code ${status})."
                  exit "$status"
                fi
                delay=$((attempt * 15))
                echo "::warning::Snyk Code scan failed transiently (exit code ${status}); retrying in ${delay}s."
                sleep "$delay"
                ;;
              *)
                echo "::error::Snyk Code scan failed with non-retryable exit code ${status}."
                exit "$status"
                ;;
            esac
          done

  dependency-lock:
    name: Dependency lock policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact pins and hashes without credentials
        run: python3 scripts/check_dependency_inputs.py

  dependency-review:
    name: Dependency review
    # Free for public repositories and needs no secret, so it runs on every
    # pull request including forks.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, SSPL-1.0
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120

  workflow-security:
    name: Workflow security analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install verified actionlint 1.7.12
        env:
          ACTIONLINT_ARCHIVE: ${{ runner.temp }}/actionlint.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$ACTIONLINT_ARCHIVE" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $ACTIONLINT_ARCHIVE" | sha256sum --check
          tar -xzf "$ACTIONLINT_ARCHIVE" -C "$RUNNER_TEMP" actionlint
      - name: Validate workflow syntax, expressions and shell steps
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: Audit workflow security with zizmor 1.32.0
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          online-audits: false
          version: 1.32.0
          persona: regular

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified gitleaks 8.30.1
        env:
          GITLEAKS_ARCHIVE: ${{ runner.temp }}/gitleaks.tar.gz
        run: |
          curl --fail --silent --show-error --location --proto "=https" --proto-redir "=https" --output "$GITLEAKS_ARCHIVE" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $GITLEAKS_ARCHIVE" | sha256sum --check
          tar -xzf "$GITLEAKS_ARCHIVE" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the commits introduced by this event
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -eu
          base="${BASE_SHA:-}"
          case "$base" in
            "" | 0000000000000000000000000000000000000000) base="" ;;
          esac
          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi
          if [ -z "$base" ] && git rev-parse --verify --quiet origin/main >/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || true)
          fi
          if [ -n "$base" ] && [ "$base" != "$HEAD_SHA" ]; then
            scan_range="$base..$HEAD_SHA"
          else
            # No usable base: every commit reachable from the tip is new here.
            scan_range="$HEAD_SHA"
          fi
          # A merge commit has no patch by default. Compare it with its first
          # parent so conflict resolutions and octopus-merge additions are scanned.
          scan_range="$scan_range --diff-merges=first-parent"
          echo "Scanning $scan_range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="$scan_range" .

  scan-gate:
    name: Required security scan gate
    needs: [lint, tests, mcp-coverage, codex-windows, host-pins, dependency-lock, workflow-security, secret-scan, dependency-review, sonarcloud, snyk, snyk-code]
    # A skipped required job permits merge, so the gate must run even after a
    # cancellation. `!cancelled()` would create a merge hole; the gate itself
    # fails on cancelled and skipped results.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require successful tests and authenticated scans
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          DEPENDABOT: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
          MAIN_REF: ${{ github.ref == 'refs/heads/main' }}
        run: python3 scripts/ci_gate.py
