name: Optional real-model Owner lifecycle quality

on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
      mode:
        type: string
        default: quality
      generation_model:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      profile:
        description: Model profile (OpenRouter requires main and model-quality secret)
        type: choice
        default: openrouter-free
        options: [openrouter-free, hosted-ollama, hosted-qwen35, hosted-qwen35-4b, reference]
      generation_model:
        description: Optional free model ID; openrouter/free enables dynamic exploration
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.mode || 'quality' }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  quality:
    # The OpenRouter API key is available only to the explicit main-branch step.
    # The reference profile retains the separately provisioned test runner.
    if: github.repository == 'cnkang/hermes-plugin-qdrant-memory' && ((inputs.mode == 'smoke' && contains(fromJSON('["smoke-ollama","smoke-qwen06","smoke-qwen08","smoke-qwen17","smoke-qwen2","smoke-qwen4"]'), inputs.profile)) || (github.event_name == 'workflow_dispatch' && inputs.mode != 'smoke' && ((inputs.profile != 'openrouter-free' && inputs.profile != 'reference') || github.ref == 'refs/heads/main')))
    runs-on: ${{ fromJSON(inputs.profile == 'reference' && '["self-hosted","linux","qdrant-memory-models"]' || '"ubuntu-24.04"') }}
    environment: ${{ inputs.profile == 'openrouter-free' && 'model-quality' || 'model-smoke' }}
    timeout-minutes: ${{ inputs.mode == 'smoke' && 30 || 90 }}
    env:
      MODEL_PROFILE: ${{ inputs.mode == 'smoke' && inputs.profile == 'smoke-ollama' && (vars.OLLAMA_SMOKE_PROFILE || secrets.OLLAMA_SMOKE_PROFILE) || inputs.profile }}
      MODEL_EVALUATION_MODE: ${{ inputs.mode || 'quality' }}
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.quality/hermes
      QUALITY_OUTPUT: ${{ github.workspace }}/.quality/owner-quality-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - name: Validate the local smoke profile before setup
        if: inputs.mode == 'smoke'
        run: |
          python3 - <<'PY'
          import os
          allowed = {'smoke-ollama', 'smoke-qwen06', 'smoke-qwen08', 'smoke-qwen17', 'smoke-qwen2', 'smoke-qwen4'}
          if os.environ['MODEL_PROFILE'] not in allowed:
              raise SystemExit('Unsupported local smoke profile')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NousResearch/hermes-agent
          ref: 8f5693af418256b89da17ddda18a9242f113dcf6
          path: .quality/hermes
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/qdrant-memory-mcp
          ref: c52437c85bce0bd6d1a81ec9bd5ddbbb98a58e9d
          path: .quality/mcp
          persist-credentials: false
      - name: Derive separate installation and model cache keys
        id: model-cache-keys
        if: inputs.profile != 'reference'
        run: |
          python - <<'PY'
          import hashlib, json, os
          profiles = json.load(open("tests/quality/model-profiles.json"))
          models = profiles["profiles"][os.environ["MODEL_PROFILE"]]["local_models"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("installation=" + profiles["ollama"]["archive_sha256"], file=output)
              print("models=" + hashlib.sha256(json.dumps(models, sort_keys=True).encode()).hexdigest(), file=output)
          PY
      - name: Cache verified dependency downloads
        id: dependency-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: quality-deps-${{ runner.os }}-${{ runner.arch }}-py311-${{ hashFiles('requirements-quality.txt', '.quality/mcp/integrations/agent-hosts/package-lock.json') }}
      - name: Cache the fixed Ollama archive
        id: ollama-cache
        if: inputs.profile != 'reference'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/quality-ollama/ollama.tar.zst
          key: quality-ollama-archive-${{ runner.os }}-${{ runner.arch }}-${{ steps.model-cache-keys.outputs.installation }}
      - name: Cache fixed local model manifests and blobs
        id: model-cache
        if: inputs.profile != 'reference'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/quality-ollama/models
          key: quality-models-${{ runner.os }}-${{ runner.arch }}-${{ steps.model-cache-keys.outputs.models }}
      - name: Prepare isolated test dependencies
        shell: bash
        run: |
          bash scripts/install_quality_dependencies.sh .quality/venv
          npm ci --prefix .quality/mcp/integrations/agent-hosts --ignore-scripts --no-audit --no-fund
      - name: Save installed dependency downloads before quality gates
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Require scorer contracts before the actual model run
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.quality/hermes
        run: .quality/venv/bin/python -m pytest tests/test_quality_metrics.py tests/test_quality_runner.py tests/test_quality_mutations.py tests/test_quality_profiles.py tests/test_quality_ollama_setup.py tests/test_model_smoke.py -q
      - name: Install and start isolated Ollama models
        if: inputs.profile != 'reference'
        run: bash scripts/start_quality_ollama.sh
      # Preserve verified downloads even when later model quality checks fail.
      - name: Save the verified Ollama archive
        if: inputs.profile != 'reference' && steps.ollama-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/quality-ollama/ollama.tar.zst
          key: ${{ steps.ollama-cache.outputs.cache-primary-key }}
      - name: Save verified local model manifests and blobs
        if: inputs.profile != 'reference' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/quality-ollama/models
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Verify multi-subject replacement with the local model
        if: inputs.profile == 'reference'
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.quality/hermes
          QDRANT_MEMORY_TEST_RELATION_MODEL: '1'
        run: |
          .quality/venv/bin/python -m pytest tests/test_explicit_dedupe.py -k multi_subject -q --junitxml=relation-model.xml
          .quality/venv/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("relation-model.xml").getroot().iter("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          assert totals["tests"] >= 2, "Both replacement contracts must execute"
          assert not any(totals[key] for key in ("failures", "errors", "skipped")), totals
          PY
      - name: Actual Ollama Hermes and Pi lifecycle quality
        if: inputs.mode != 'smoke' && inputs.profile != 'openrouter-free'
        run: .quality/venv/bin/python scripts/evaluate_owner_lifecycle.py --model-profile "$MODEL_PROFILE" --adapter-root .quality/mcp --scenarios tests/quality/lifecycle-mutations-v1.json --output "$QUALITY_OUTPUT"
      - name: Actual OpenRouter lifecycle quality
        if: inputs.mode != 'smoke' && inputs.profile == 'openrouter-free' && github.ref == 'refs/heads/main'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_QUALITY_MODEL: ${{ inputs.generation_model || vars.OPENROUTER_QUALITY_MODEL || secrets.OPENROUTER_QUALITY_MODEL }}
        run: .quality/venv/bin/python scripts/evaluate_owner_lifecycle.py --model-profile "$MODEL_PROFILE" --adapter-root .quality/mcp --scenarios tests/quality/lifecycle-mutations-v1.json --output "$QUALITY_OUTPUT"
      - name: Actual small-model lifecycle smoke
        if: inputs.mode == 'smoke'
        run: .quality/venv/bin/python scripts/smoke_owner_lifecycle.py --adapter-root .quality/mcp --output "$QUALITY_OUTPUT" --repetitions 5 --model-profile "$MODEL_PROFILE"
      - name: Require evidence for the selected evaluation mode
        run: |
          .quality/venv/bin/python - <<'PY'
          import json, os
          d = json.load(open(os.environ['QUALITY_OUTPUT']))
          assert d['model_profile'] == os.environ['MODEL_PROFILE']
          if os.environ['MODEL_EVALUATION_MODE'] == 'smoke':
              assert d['status'] == 'SMOKE_PASS' and d['evaluation_mode'] == 'smoke'
              assert d['requested_repetitions'] == 5 and len(d['runs']) == 5
              assert d['quality_evaluated'] is False and d['baseline_executed'] is False
          else:
              assert d['status'] == 'PASS' and d['baseline_executed'] is True
              assert d['mutation_scenarios']['status'] == 'PASS'
          PY
      - name: Stop the test-owned Ollama process
        if: always() && inputs.profile != 'reference'
        shell: bash
        run: |
          python - <<'PY'
          import os, signal
          from pathlib import Path
          pid = Path(os.environ["RUNNER_TEMP"]) / "quality-ollama/pid"
          if pid.is_file():
              try:
                  os.kill(int(pid.read_text()), signal.SIGTERM)
              except ProcessLookupError:
                  pass
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-model-quality
          path: |
            ${{ github.workspace }}/.quality/owner-quality-${{ github.run_id }}-${{ github.run_attempt }}.json
            ${{ runner.temp }}/quality-model-resources.json
            relation-model.xml
          if-no-files-found: error
