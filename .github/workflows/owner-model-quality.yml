name: Optional real-model Owner lifecycle quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-model-quality
  cancel-in-progress: false

jobs:
  quality:
    # Dedicated disposable test runner: never register a production/model host here.
    # No pull_request trigger can send untrusted fork code to this runner.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'cnkang/hermes-plugin-qdrant-memory'
    runs-on: [self-hosted, linux, qdrant-memory-models]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: NousResearch/hermes-agent
          ref: 8f5693af418256b89da17ddda18a9242f113dcf6
          path: .quality/hermes
          persist-credentials: false
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/qdrant-memory-mcp
          ref: 4cc2f36048ae15460f0db339523d69e1a332e093
          path: .quality/mcp
          persist-credentials: false
      - name: Prepare isolated test dependencies
        shell: bash
        run: |
          bash scripts/install_quality_dependencies.sh .quality/venv
          npm ci --prefix .quality/mcp/integrations/agent-hosts --ignore-scripts --no-audit --no-fund
      - name: Require scorer contracts before the actual model run
        run: .quality/venv/bin/python -m pytest tests/test_quality_metrics.py tests/test_quality_runner.py tests/test_quality_mutations.py -q
      - name: Actual local-model Hermes and Pi lifecycle quality
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.quality/hermes
          QUALITY_OUTPUT: ${{ runner.temp }}/owner-quality-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: .quality/venv/bin/python scripts/evaluate_owner_lifecycle.py --adapter-root .quality/mcp --scenarios tests/quality/lifecycle-mutations-v1.json --output "$QUALITY_OUTPUT"
      - name: Require full baseline and mutation evidence
        env:
          QUALITY_OUTPUT: ${{ runner.temp }}/owner-quality-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: >-
          .quality/venv/bin/python -c "import json,os;
          d=json.load(open(os.environ['QUALITY_OUTPUT']));
          assert d['status']=='PASS' and d['baseline_executed'] is True;
          assert d['mutation_scenarios']['status']=='PASS'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: owner-model-quality
          path: ${{ runner.temp }}/owner-quality-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
