name: Standalone compatibility

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Standalone CLI and MCP (${{ matrix.os }}, Python ${{ matrix.python }}, SDK ${{ matrix.mcp.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.14']
        mcp:
          - name: '1.x'
            requirement: 'mcp>=1.30,<2'
          - name: '2.x'
            requirement: 'mcp>=2,<3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install standalone package without a Hermes checkout
        run: python -m pip install ".[remote]" "pytest>=8,<10" "${{ matrix.mcp.requirement }}"
      - name: Require standalone subprocess, public API and official MCP contracts
        run: python -m pytest -q tests/standalone --junitxml=standalone-results.xml
      - name: Reject skipped or incomplete acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E; r=E.parse('standalone-results.xml');
          s=r.findall('.//testsuite');
          assert sum(int(x.get('tests',0)) for x in s)>=37;
          assert sum(int(x.get('skipped',0)) for x in s)==0"

      - name: Save standalone acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-${{ matrix.os }}-python-${{ matrix.python }}-mcp-${{ matrix.mcp.name }}
          path: standalone-results.xml
          if-no-files-found: error
