name: Standalone compatibility

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Standalone CLI and MCP (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install standalone package without a Hermes checkout
        run: python -m pip install ".[mcp]" "pytest>=8,<10"
      - name: Require standalone subprocess and official MCP contracts
        run: python -m pytest -q tests/standalone --junitxml=standalone-results.xml
      - name: Reject skipped or incomplete acceptance
        run: >-
          python -c "import xml.etree.ElementTree as E; r=E.parse('standalone-results.xml');
          s=r.findall('.//testsuite');
          assert sum(int(x.get('tests',0)) for x in s)>=8;
          assert sum(int(x.get('skipped',0)) for x in s)==0"

      - name: Save standalone acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: standalone-${{ matrix.os }}-python-${{ matrix.python }}
          path: standalone-results.xml
          if-no-files-found: error
