name: Scheduled security

# A credentialed scan that is too expensive to repeat per commit. The
# schedule and a maintainer dispatch are the only triggers, so no pull
# request can reach SNYK_TOKEN. GitHub secret scanning and push protection,
# which need no workflow, cover secrets in the full history.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snyk-code:
    name: Snyk Code weekly scan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require Snyk credentials
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          test -n "$SNYK_TOKEN" || { echo '::error::Configure SNYK_TOKEN for the Snyk organization.'; exit 1; }
      - uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce
      - name: Scan source
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          attempts=2
          for attempt in 1 2; do
            echo "Snyk Code scan attempt ${attempt}/${attempts} (12-minute limit)"
            log="$RUNNER_TEMP/snyk-code-${attempt}.log"
            if timeout --kill-after=30s 12m snyk code test . --severity-threshold=high 2>&1 | tee "$log"; then
              exit 0
            else
              status=${PIPESTATUS[0]}
            fi
            if grep -qiE 'authentication failed|not authenticated|invalid token|unauthorized|SNYK_TOKEN' "$log"; then
              echo "::error::Snyk Code authentication failed (AUTH_ERROR)."
              exit 1
            fi
            case "$status" in
              1|3)
                # Documented findings or a real scan result: never retry.
                exit "$status"
                ;;
              2|124|137)
                if [ "$attempt" -eq "$attempts" ]; then
                  echo "::error::Snyk Code scan failed after ${attempts} attempts (exit code ${status})."
                  exit "$status"
                fi
                echo "::warning::Snyk Code scan failed transiently (exit code ${status}); retrying once."
                sleep 30
                ;;
              *)
                echo "::error::Snyk Code scan failed with non-retryable exit code ${status}."
                exit "$status"
                ;;
            esac
          done
