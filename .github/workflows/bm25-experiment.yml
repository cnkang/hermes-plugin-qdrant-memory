                  }
              })
              assert r.status_code == 200, f'Index creation failed: {r.text}'
              
              import time
              for _ in range(20):
                  r = http.get('/collections/test_1201_hybrid')
                  schema = r.json().get('result', {}).get('payload_schema', {})
                  if 'text' in schema and schema['text'].get('params', {}).get('scoring'):
                      break
