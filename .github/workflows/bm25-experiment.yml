                  'created_at': '2026-01-01T00:00:00Z',
                  'updated_at': '2026-01-01T00:00:00Z'
              })])
          
          # Create multilingual index with BM25 scoring
          import httpx
          with httpx.Client(base_url='http://127.0.0.1:6333', timeout=30) as http:
              r = http.put('/collections/test_1201_hybrid/index', json={
                  'field_name': 'text',
                  'field_schema': {
                      'type': 'text',
