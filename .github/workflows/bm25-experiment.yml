          store.initialize(create=True, reset=False)
          
          # Insert test docs
          docs = [
              (str(uuid.uuid4()), 'Python async programming tutorial'),
              (str(uuid.uuid4()), 'Redis cluster deployment'),
              (str(uuid.uuid4()), '中英混写测试 Python异步'),
          ]
          for doc_id, text in docs:
              store.upsert([(doc_id, {
                  'text': text,
                  'user_id': 'test_user',
                  'agent_id': 'test_agent',
                  'source': 'test',
                  'category': ['test'],
                  'importance': 0.5,
                  'metadata': {},
                  'session_id': '',
