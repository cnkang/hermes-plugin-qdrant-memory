name: Publish Runtime
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Verify release identity and ancestry
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python -c 'import os,tomllib; from pathlib import Path; v=tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'pytest>=8,<10'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test installed wheel without Hermes
        run: |
          python -m pip install "$(find dist -name '*.whl')[mcp]"
          python -I -m pytest --import-mode=importlib -q tests/standalone
      - name: Test installed sdist without Hermes
        run: |
          python -m pip install --force-reinstall "$(find dist -name '*.tar.gz')[mcp]"
          python -I -m pytest --import-mode=importlib -q tests/standalone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: runtime-distributions
          path: dist/*
          if-no-files-found: error
  pypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-distributions
          path: dist
      - name: Check immutable PyPI version
        id: existing
        run: python scripts/check_pypi_release.py
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        if: steps.existing.outputs.exists != 'true'
      - name: Verify publicly available artifacts
        run: python scripts/check_pypi_release.py --require
