name: Pi quality driver contract

on:
  push:
    branches: [main]
    paths:
      - scripts/pi_lifecycle_quality.mjs
      - tests/test_pi_quality_driver.py
      - .github/workflows/pi-quality-driver.yml
      - .github/workflows/owner-model-quality.yml
      - requirements-quality.in
      - requirements-quality.txt
      - requirements.txt
      - pyproject.toml
      - scripts/install_quality_dependencies.sh
      - scripts/evaluate_owner_lifecycle.py
      - scripts/start_quality_ollama.sh
      - tests/test_quality_profiles.py
      - tests/quality/model-profiles.json
      - qdrant_memory/quality_metrics.py
      - tests/test_quality_dependencies.py
      - tests/test_quality_metrics.py
      - tests/test_quality_runner.py
      - tests/test_dependency_security.py
      - tests/quality/lifecycle-v1.json
      - tests/quality/lifecycle-mutations-v1.json
  pull_request:
    paths:
      - scripts/pi_lifecycle_quality.mjs
      - tests/test_pi_quality_driver.py
      - .github/workflows/pi-quality-driver.yml
      - .github/workflows/owner-model-quality.yml
      - requirements-quality.in
      - requirements-quality.txt
      - requirements.txt
      - pyproject.toml
      - scripts/install_quality_dependencies.sh
      - scripts/evaluate_owner_lifecycle.py
      - scripts/start_quality_ollama.sh
      - tests/test_quality_profiles.py
      - tests/quality/model-profiles.json
      - qdrant_memory/quality_metrics.py
      - tests/test_quality_dependencies.py
      - tests/test_quality_metrics.py
      - tests/test_quality_runner.py
      - tests/test_dependency_security.py
      - tests/quality/lifecycle-v1.json
      - tests/quality/lifecycle-mutations-v1.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-contract:
    name: Pi quality driver contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: NousResearch/hermes-agent
          ref: 8f5693af418256b89da17ddda18a9242f113dcf6
          path: .quality/hermes
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: cnkang/qdrant-memory-mcp
          ref: c52437c85bce0bd6d1a81ec9bd5ddbbb98a58e9d
          path: .quality/mcp
          persist-credentials: false
      - name: Cache verified dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: quality-deps-${{ runner.os }}-${{ runner.arch }}-py311-${{ hashFiles('requirements-quality.txt', '.quality/mcp/integrations/agent-hosts/package-lock.json') }}
      - name: Install locked Pi SDK and test runner
        run: |
          bash scripts/install_quality_dependencies.sh .quality/venv
          npm ci --prefix .quality/mcp/integrations/agent-hosts --ignore-scripts --no-audit --no-fund
      - name: Verify model dependency snapshot and scorer contracts
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/.quality/hermes
        run: |
          .quality/venv/bin/python -m pytest tests/test_quality_dependencies.py tests/test_quality_metrics.py tests/test_quality_runner.py tests/test_quality_profiles.py tests/test_dependency_security.py -q --junitxml=quality-dependencies.xml
      - name: Verify actual Pi driver attribution
        env:
          QDRANT_QUALITY_ADAPTER_ROOT: ${{ github.workspace }}/.quality/mcp
        run: .quality/venv/bin/python -m pytest tests/test_pi_quality_driver.py -q --junitxml=driver-contract.xml
      - name: Reject skipped or absent driver contracts
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for report in ("driver-contract.xml", "quality-dependencies.xml"):
              suites = list(ET.parse(report).getroot().iter("testsuite"))
              totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                        for key in ("tests", "failures", "errors", "skipped")}
              assert totals["tests"] > 0, f"Contract did not execute: {report}"
              assert not any(totals[key] for key in ("failures", "errors", "skipped")), totals
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pi-quality-driver-contract
          path: |
            driver-contract.xml
            quality-dependencies.xml
          if-no-files-found: error
