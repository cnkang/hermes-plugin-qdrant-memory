name: Pi quality driver contract

on:
  push:
    branches: [main]
    paths:
      - scripts/pi_lifecycle_quality.mjs
      - tests/test_pi_quality_driver.py
      - .github/workflows/pi-quality-driver.yml
  pull_request:
    paths:
      - scripts/pi_lifecycle_quality.mjs
      - tests/test_pi_quality_driver.py
      - .github/workflows/pi-quality-driver.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-contract:
    name: Pi quality driver contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          repository: cnkang/qdrant-memory-mcp
          ref: 4a76bf9211ce48b5dcf40caa60e4a91107aa687f
          path: .quality/mcp
          persist-credentials: false
      - name: Install locked Pi SDK and test runner
        run: |
          python -m pip install 'pytest>=8,<10'
          npm ci --prefix .quality/mcp/integrations/agent-hosts --ignore-scripts --no-audit --no-fund
      - name: Verify actual Pi driver attribution
        env:
          QDRANT_QUALITY_ADAPTER_ROOT: ${{ github.workspace }}/.quality/mcp
        run: python -m pytest tests/test_pi_quality_driver.py -q --junitxml=driver-contract.xml
      - name: Reject skipped or absent driver contracts
        if: always()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse("driver-contract.xml").getroot().iter("testsuite"))
          totals = {key: sum(int(suite.get(key, "0")) for suite in suites)
                    for key in ("tests", "failures", "errors", "skipped")}
          assert totals["tests"] > 0, "Driver contract did not execute"
          assert not any(totals[key] for key in ("failures", "errors", "skipped")), totals
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: pi-quality-driver-contract
          path: driver-contract.xml
          if-no-files-found: error
