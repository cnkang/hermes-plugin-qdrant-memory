name: Runtime packaging
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  packaging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - run: python -m pip install 'build>=1.2,<2' 'twine>=6,<7' 'pytest>=8,<10'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Verify fresh wheel installation and no-Hermes protocol
        run: |
          python -m venv .wheel-env
          .wheel-env/bin/python -m pip install "$(find dist -name '*.whl')[mcp]" 'pytest>=8,<10'
          .wheel-env/bin/python -I -m pytest --import-mode=importlib -q tests/standalone
      - name: Verify fresh sdist installation and no-Hermes protocol
        run: |
          python -m venv .sdist-env
          .sdist-env/bin/python -m pip install "$(find dist -name '*.tar.gz')[mcp]" 'pytest>=8,<10'
          .sdist-env/bin/python -I -m pytest --import-mode=importlib -q tests/standalone
      - name: Preserve published MCP data through operator upgrade
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          OLD_ENV="$RUNNER_TEMP/runtime-mcp-0.3.3"
          NEW_ENV="$RUNNER_TEMP/runtime-operator-upgrade"
          DATA="$RUNNER_TEMP/runtime-operator-data"
          python -m venv "$OLD_ENV"
          "$OLD_ENV/bin/python" -m pip install 'qdrant-memory-mcp==0.3.3'
          "$OLD_ENV/bin/python" -I tests/standalone/public_upgrade_acceptance.py prepare "$DATA" "0.6.2"
          python -m venv "$NEW_ENV"
          "$NEW_ENV/bin/python" -m pip install "$(find dist -name '*.whl')[mcp]"
          "$NEW_ENV/bin/python" -I tests/standalone/public_upgrade_acceptance.py verify "$DATA" "$VERSION"
      - name: Preserve published data through wheel upgrade
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          for FROM in 0.6.1 0.6.3; do
            ENV="$RUNNER_TEMP/runtime-upgrade-$FROM"
            DATA="$RUNNER_TEMP/runtime-upgrade-data-$FROM"
            python -m venv "$ENV"
            "$ENV/bin/python" -m pip install "hermes-plugin-qdrant-memory[mcp]==$FROM"
            "$ENV/bin/python" -I tests/standalone/upgrade_fixture.py prepare "$DATA" "$FROM"
            "$ENV/bin/python" -m pip install "$(find dist -name '*.whl')[mcp]"
            "$ENV/bin/python" -I tests/standalone/upgrade_fixture.py verify "$DATA" "$VERSION"
          done
