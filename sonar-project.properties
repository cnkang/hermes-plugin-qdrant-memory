# Reviewed local-only transport decision: docs/shared-memory/architecture.md.
# Remove this exception before adding remote or non-loopback service bindings.
#
# Reviewed async decision: HTTPX awaits every response hook
# (httpx._client.AsyncClient._send_request calls `await hook(response)`), so the
# hook that preserves a rejected HTTP status must be a coroutine function even
# though its body performs no I/O. See qdrant_memory/remote_client.py.
sonar.issue.ignore.multicriteria=sharedLoopbackHttp,remoteResponseHook
sonar.issue.ignore.multicriteria.sharedLoopbackHttp.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.sharedLoopbackHttp.resourceKey=qdrant_memory/shared_service.py
sonar.issue.ignore.multicriteria.remoteResponseHook.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.remoteResponseHook.resourceKey=qdrant_memory/remote_client.py
