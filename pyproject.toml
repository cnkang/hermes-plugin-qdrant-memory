[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-plugin-qdrant-memory"
version = "0.1.0"
description = "Standalone durable Qdrant memory provider for Hermes Agent"
requires-python = ">=3.11"
dependencies = ["qdrant-client>=1.15,<2", "httpx>=0.28,<1"]

[project.entry-points."hermes_agent.memory_providers"]
qdrant-memory = "qdrant_memory:register"

[dependency-groups]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruamel.yaml==0.18.16"]

[tool.setuptools.packages.find]
include = ["qdrant_memory*"]

[tool.setuptools.package-data]
qdrant_memory = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
